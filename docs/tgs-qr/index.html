<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Idolelic TGS QR</title>
    <style>
      body {
        margin: 0;
        font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
        color: #1f1f1f;
        background: #fff;
      }
      .sheet {
        max-width: 900px;
        margin: 0 auto;
        padding: 2rem 1.5rem 3rem;
      }
      h1 {
        margin: 0 0 0.35rem;
        font-size: 1.6rem;
      }
      .sub {
        margin: 0 0 1.75rem;
        color: #666;
        font-size: 0.95rem;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.25rem;
      }
      .card {
        border: 2px solid #f0d0df;
        border-radius: 1rem;
        padding: 1.25rem;
        text-align: center;
      }
      .card h2 {
        margin: 0 0 0.35rem;
        font-size: 1.15rem;
        color: #c2185b;
      }
      .card p {
        margin: 0 0 1rem;
        font-size: 0.85rem;
        color: #555;
        line-height: 1.5;
      }
      .card img {
        width: 220px;
        height: 220px;
        image-rendering: pixelated;
        background: #fff;
      }
      .url {
        margin-top: 0.85rem;
        font-size: 0.72rem;
        word-break: break-all;
        color: #888;
      }
      @media print {
        .sheet {
          padding: 0;
        }
      }
      @media (max-width: 700px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="sheet">
      <h1>Idolelic — TGS 展示用 QR</h1>
      <p class="sub">印刷してブースに貼ってください。スマホのカメラで読み取れます。</p>
      <div class="grid">
        <section class="card">
          <h2>本番アプリ</h2>
          <p>地図・聖地・掲示板など本番環境</p>
          <img src="qr-production-home.png" alt="本番アプリのQRコード" />
          <p class="url">https://idolelic.vercel.app/home</p>
        </section>
        <section class="card">
          <h2>加速度 × 速度制限デモ</h2>
          <p>その場振りは無効 / 徒歩速度のときだけ有効歩数</p>
          <img src="qr-accel-demo.png" alt="加速度デモのQRコード" />
          <p class="url">https://idolelic.vercel.app/tgs?view=walk</p>
        </section>
      </div>
    </div>
  </body>
</html>
